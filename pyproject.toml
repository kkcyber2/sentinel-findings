[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-findings"
version = "1.0.0"
description = "One canonical finding schema, adapters for common scanners, and HTML/PDF report rendering."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kkcyber2" }]
keywords = ["security", "findings", "sarif", "report", "pdf"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pypdf>=4"]

[project.scripts]
sentinel-findings = "sentinel_findings.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel_findings*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
